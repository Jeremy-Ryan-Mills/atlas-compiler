name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR or branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .gitmodules uses an SSH URL; CI has no SSH key, and npu_model is public.
      - name: Fetch npu_model (rtl-match)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 third_party/npu_model

      - name: Build atlas-opt
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Equivalence and regression tests (npu_model)
        run: uv run --locked pytest
